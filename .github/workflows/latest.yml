# Refreshes the "Latest" section after both project repos have published for the day.
name: latest
on:
  schedule:
    - cron: "17 23 * * *"
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Commit timestamps in New York time so each day's work lands on the right square.
env:
  TZ: America/New_York

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python .github/scripts/update_latest.py
      - name: Commit if changed
        run: |
          git diff --quiet && { echo "No changes"; exit 0; }
          git -c user.name=Sebas -c user.email=sebasbecerra70@gmail.com commit -am "Update latest projects"
          git push
